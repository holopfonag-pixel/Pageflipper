<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ساعة قبل الفجر</title>
<meta name="description" content="زوال التفكير اليومي المعتاد." />
<script src="novel-data.js"></script>
<script src="script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+Arabic:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600&family=Inter:wght@300;400;500;600&family=Noto+Sans+Arabic:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Full-bleed atmosphere layer. Swap the background-image in style.css
       ( .atmosphere selector ) for the user's own artwork. -->
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="atmosphere__vignette" aria-hidden="true"></div>

  <!-- ============ HEADER ============ -->
  <header class="frame frame--header">
    <div class="brand" data-view-trigger="home">
      <span class="brand__glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 3H18" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
          <path d="M6 21H18" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
          <path d="M7 3C7 8 12 10.5 12 12C12 10.5 17 8 17 3" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 21C7 16 12 13.5 12 12C12 13.5 17 16 17 21" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand__text">
        <span class="brand__title serif" data-i18n="meta.title"></span>
        <span class="brand__tagline" data-i18n="meta.tagline"></span>
      </span>
    </div>

    <nav class="nav" aria-label="Primary">
      <button class="nav__link is-active" data-view="home" data-i18n="ui.navHome"></button>
      <button class="nav__link" data-view="chapters" data-i18n="ui.navChapters"></button>
      <button class="nav__link" data-view="about" data-i18n="ui.navAbout"></button>
    </nav>

    <div class="lang-switch" role="group" aria-label="Language">
      <button class="lang-switch__btn is-active" data-lang="ar">AR</button>
      <button class="lang-switch__btn" data-lang="en">EN</button>
      <button class="lang-switch__btn" data-lang="ja">JA</button>
    </div>
  </header>

  <!-- ============ MAIN VIEWS ============ -->
  <main id="app">

    <!-- HOME -->
    <section class="view is-active" data-view-panel="home">
      <div class="frame frame--hero">
        <p class="eyebrow" data-i18n="meta.tagline"></p>
        <h1 class="hero__title serif" data-i18n="meta.title"></h1>

        <div class="hero__meta">
          <span class="meta-pill">
            <span class="meta-pill__label" data-i18n="ui.authorLabel"></span>
            <span class="meta-pill__value" data-i18n="meta.author"></span>
          </span>
          <span class="meta-pill meta-pill--status">
            <span class="meta-pill__label" data-i18n="ui.statusLabel"></span>
            <span class="meta-pill__value" data-i18n="meta.status"></span>
          </span>
        </div>

        <p class="hero__synopsis" data-i18n="meta.synopsis"></p>

        <button class="btn btn--primary" data-view="reader" data-chapter="1">
          <span data-i18n="ui.startReading"></span>
          <span class="btn__arrow" aria-hidden="true">→</span>
        </button>
      </div>
    </section>

    <!-- CHAPTERS -->
    <section class="view" data-view-panel="chapters">
      <div class="frame frame--panel">
        <h2 class="panel__title serif" data-i18n="ui.chapterListTitle"></h2>
        <ul class="chapter-list" id="chapter-list"></ul>
      </div>
    </section>

    <!-- ABOUT -->
    <section class="view" data-view-panel="about">
      <div class="frame frame--panel">
        <h2 class="panel__title serif" data-i18n="ui.navAbout"></h2>
        <p class="about__body" data-i18n="ui.aboutBody"></p>
        <dl class="about__facts">
          <div class="about__fact">
            <dt data-i18n="ui.authorLabel"></dt>
            <dd data-i18n="meta.author"></dd>
          </div>
          <div class="about__fact">
            <dt data-i18n="ui.statusLabel"></dt>
            <dd data-i18n="meta.status"></dd>
          </div>
        </dl>
      </div>
    </section>

    <!-- READER -->
    <section class="view" data-view-panel="reader">
      <div class="frame frame--reader">
        <div class="reader__toolbar">
          <button class="reader__back" data-view="chapters">
            <span class="reader__back-arrow" aria-hidden="true">→</span>
            <span data-i18n="ui.backToChapters"></span>
          </button>

          <div class="reader__progress" aria-hidden="true">
            <svg viewBox="0 0 40 40" width="28" height="28">
              <circle class="progress__track" cx="20" cy="20" r="17" fill="none" stroke-width="1.5"/>
              <circle id="progress-ring" class="progress__ring" cx="20" cy="20" r="17" fill="none" stroke-width="1.5"/>
            </svg>
          </div>

          <div class="reader__font-controls">
            <button id="font-dec" data-i18n-aria="ui.decreaseFont">A−</button>
            <button id="font-inc" data-i18n-aria="ui.increaseFont">A+</button>
          </div>
        </div>

        <article class="reader__article">
          <h1 class="reader__title serif" id="reader-title"></h1>
          <div class="reader__body" id="reader-body"></div>
        </article>

        <div class="reader__nav">
          <button class="btn btn--ghost" id="btn-prev" disabled>
            <span data-i18n="ui.prevChapter"></span>
          </button>
          <button class="btn btn--ghost" id="btn-next" disabled>
            <span data-i18n="ui.nextChapter"></span>
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="frame frame--footer">
    <span class="serif" data-i18n="meta.title"></span>
    <span class="footer__dot" aria-hidden="true">·</span>
    <span data-i18n="ui.footerRights"></span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  
</body>
</html>
