<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="night" data-font="naskh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>for lunch time — One end</title>
<meta name="description" content="for lunch time — منصة قراءة رواية One end: Looking inside a different world، تأليف zakaria">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
<script src="novel-data.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   for lunch time — e-reader
   ترتيب الملف: 1) HTML  2) CSS  3) JS (المحرك العام)  4) JS (بيانات الرواية)
   ============================================================ */

/* ---------- 1. الجذور / التوكِنز (Design Tokens) ---------- */
:root{
  /* لوحة الألوان الأساسية: رمادي داكن + سماوي متوهّج (هوية الموقع) */
  --bg-void:#12151A;
  --bg-surface:#1B2027;
  --bg-surface-2:#242B33;
  --bg-surface-3:#2C343D;
  --glass:rgba(255,255,255,.045);
  --glass-strong:rgba(255,255,255,.075);
  --border-glass:rgba(255,255,255,.09);
  --border-glass-soft:rgba(255,255,255,.06);

  --sky:#4FD1E8;
  --sky-dim:#2E96AC;
  --sky-ink:#0C2A30;
  --sky-glow:rgba(79,209,232,.35);
  --sky-glow-soft:rgba(79,209,232,.16);

  --ink-1:#E7ECEF;
  --ink-2:#93A0AC;
  --ink-3:#5C6873;

  --danger:#E8734F;
  --ok:#4FE8A3;

  --sp-1:.25rem; --sp-2:.5rem; --sp-3:.75rem; --sp-4:1rem;
  --sp-5:1.5rem; --sp-6:2rem; --sp-7:3rem; --sp-8:4rem;

  --radius-sm:8px; --radius-md:14px; --radius-lg:22px; --radius-xl:30px; --radius-round:999px;

  --shadow-soft:0 8px 30px rgba(0,0,0,.35);
  --shadow-lift:0 16px 50px rgba(0,0,0,.45);
  --shadow-glow:0 0 40px var(--sky-glow);

  --ease:cubic-bezier(.22,.61,.36,1);
  --dur-1:150ms; --dur-2:280ms; --dur-3:480ms;

  --font-display:'Cairo','Segoe UI',sans-serif;
  --font-naskh:'Noto Naskh Arabic','Traditional Arabic',serif;
  --font-cairo:'Cairo',sans-serif;
  --font-tajawal:'Tajawal',sans-serif;
  --font-latin:'Noto Sans','Noto Sans JP',system-ui,-apple-system,sans-serif;
  --font-reading:var(--font-naskh);

  --bg-app:var(--bg-void);
  --bg-card:var(--bg-surface);
  --text-main:var(--ink-1);
  --text-muted:var(--ink-2);
  --accent:var(--sky);
  --content-glow:radial-gradient(ellipse 60% 40% at 50% 0%, var(--sky-glow-soft), transparent 70%);
  --sidebar-w:300px;
}

/* سِمات القراءة الثلاث — مطبّقة على كامل الصفحة */
html[data-theme="night"]{
  --bg-app:var(--bg-void); --bg-card:var(--bg-surface);
  --text-main:#E7ECEF; --text-muted:#93A0AC;
  --content-glow:radial-gradient(ellipse 60% 40% at 50% 0%, var(--sky-glow-soft), transparent 70%);
}
html[data-theme="day"]{
  --bg-app:#F3EEE4; --bg-card:#FBF8F2;
  --text-main:#2B2620; --text-muted:#6E6459;
  --sky:#187E90; --sky-dim:#0F5C6B; --sky-glow:rgba(24,126,144,.22); --sky-glow-soft:rgba(24,126,144,.10);
  --border-glass:rgba(30,25,15,.10); --border-glass-soft:rgba(30,25,15,.06);
  --glass:rgba(30,25,15,.03); --glass-strong:rgba(30,25,15,.06);
  --content-glow:none;
}
html[data-theme="dusk"]{
  --bg-app:#171B2E; --bg-card:#1E2338;
  --text-main:#DCE3EA; --text-muted:#8B93AE;
  --sky:#7AD9F0; --sky-glow:rgba(122,217,240,.30); --sky-glow-soft:rgba(122,217,240,.14);
  --content-glow:radial-gradient(ellipse 70% 50% at 50% 0%, var(--sky-glow-soft), transparent 75%);
}

/* الخطوط الثلاثة القابلة للتبديل */
html[data-font="naskh"]{ --font-reading:var(--font-naskh); }
html[data-font="cairo"]{ --font-reading:var(--font-cairo); }
html[data-font="tajawal"]{ --font-reading:var(--font-tajawal); }

/* عند تبديل اللغة إلى لغة غير عربية: التبديل التلقائي لاتجاه الصفحة والخط */
html[dir="ltr"]{ --font-reading:var(--font-latin); }
html[dir="ltr"] .chapter-title, html[dir="ltr"] .novel-title{ font-family:var(--font-latin); }
html[dir="ltr"] #prevIcon, html[dir="ltr"] #nextIcon{ transform:scaleX(-1); }

/* ---------- 2. Reset أساسي ---------- */
*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto; }
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}
body{
  margin:0; min-height:100vh;
  background:var(--bg-app); color:var(--text-main);
  font-family:var(--font-display);
  transition:background var(--dur-3) var(--ease), color var(--dur-3) var(--ease);
  overflow-x:hidden;
}
img{ max-width:100%; display:block; }
button{ font-family:inherit; }
h1,h2,h3,p{ margin:0; }
ul{ margin:0; padding:0; list-style:none; }
a{ color:inherit; }

/* رابط تخطّي للوصول */
.skip-link{
  position:fixed; inset-inline-start:var(--sp-4); top:-60px; z-index:400;
  background:var(--sky); color:var(--sky-ink); padding:var(--sp-3) var(--sp-4);
  border-radius:var(--radius-sm); font-weight:700; transition:top var(--dur-2) var(--ease);
}
.skip-link:focus{ top:var(--sp-4); }

:focus-visible{ outline:2px solid var(--sky); outline-offset:3px; border-radius:4px; }

/* ---------- 3. شريط تقدّم القراءة (شعاع الضوء) ---------- */
.progress-beam{
  position:fixed; inset-inline-start:0; top:0; height:3px; width:0%;
  z-index:500; pointer-events:none;
  background:linear-gradient(90deg, transparent, var(--sky), var(--sky));
  box-shadow:0 0 12px 1px var(--sky-glow);
  transition:width 80ms linear;
}

/* ---------- 4. الشريط العلوي ---------- */
.topbar{
  position:sticky; top:0; z-index:120;
  display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-5);
  background:color-mix(in srgb, var(--bg-app) 78%, transparent);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--border-glass-soft);
}
.topbar-start,.topbar-end{ display:flex; align-items:center; gap:var(--sp-2); }
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:40px; height:40px; border-radius:var(--radius-round);
  background:var(--glass); border:1px solid var(--border-glass); color:var(--text-main);
  cursor:pointer; position:relative; transition:background var(--dur-2) var(--ease), transform var(--dur-1) var(--ease), box-shadow var(--dur-2) var(--ease);
}
.icon-btn:hover{ background:var(--glass-strong); box-shadow:0 0 0 4px var(--sky-glow-soft); }
.icon-btn:active{ transform:scale(.92); }
.icon-btn svg{ width:19px; height:19px; }
.badge-count{
  position:absolute; top:-4px; inset-inline-end:-4px; min-width:16px; height:16px; padding:0 3px;
  background:var(--sky); color:var(--sky-ink); border-radius:var(--radius-round);
  font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center;
  opacity:0; transform:scale(.5); transition:all var(--dur-2) var(--ease);
}
.badge-count.show{ opacity:1; transform:scale(1); }

.reading-time-pill{
  display:flex; align-items:center; gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-4); border-radius:var(--radius-round);
  background:var(--glass); border:1px solid var(--border-glass);
  font-size:.82rem; color:var(--text-muted); white-space:nowrap;
}
.reading-time-pill svg{ width:15px; height:15px; color:var(--sky); flex-shrink:0; }

.control-group{ position:relative; }
.control-trigger{
  display:flex; align-items:center; gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-3); border-radius:var(--radius-round);
  background:var(--glass); border:1px solid var(--border-glass); color:var(--text-main);
  cursor:pointer; font-size:.82rem; transition:background var(--dur-2) var(--ease);
}
.control-trigger:hover{ background:var(--glass-strong); }
.control-trigger svg{ width:16px; height:16px; }
.control-panel{
  position:absolute; top:calc(100% + 10px); inset-inline-end:0; min-width:190px;
  background:var(--bg-card); border:1px solid var(--border-glass); border-radius:var(--radius-md);
  box-shadow:var(--shadow-lift); padding:var(--sp-2); opacity:0; visibility:hidden; transform:translateY(-6px);
  transition:all var(--dur-2) var(--ease); z-index:200; backdrop-filter:blur(20px);
}
.control-group.open .control-panel{ opacity:1; visibility:visible; transform:translateY(0); }
.control-option{
  display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2);
  padding:var(--sp-3); border-radius:var(--radius-sm); cursor:pointer; font-size:.85rem;
  transition:background var(--dur-1) var(--ease);
}
.control-option:hover{ background:var(--glass-strong); }
.control-option.active{ color:var(--sky); }
.control-option .dot{ width:8px; height:8px; border-radius:50%; background:currentColor; opacity:0; }
.control-option.active .dot{ opacity:1; box-shadow:0 0 8px var(--sky-glow); }

/* ---------- 5. الشريط الجانبي (فهرس المحتويات) ---------- */
.sidebar-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:150; opacity:0; visibility:hidden;
  transition:opacity var(--dur-2) var(--ease); backdrop-filter:blur(2px);
}
.sidebar-overlay.show{ opacity:1; visibility:visible; }
.sidebar{
  position:fixed; inset-inline-start:0; top:0; bottom:0; width:var(--sidebar-w); z-index:160;
  background:color-mix(in srgb, var(--bg-surface) 92%, transparent);
  backdrop-filter:blur(22px); border-inline-end:1px solid var(--border-glass-soft);
  display:flex; flex-direction:column; transform:translateX(calc(-1 * var(--sidebar-w)));
  transition:transform var(--dur-3) var(--ease);
}
html[dir="rtl"] .sidebar{ transform:translateX(var(--sidebar-w)); }
.sidebar.open{ transform:translateX(0); }
.sidebar-head{
  display:flex; align-items:center; justify-content:space-between; padding:var(--sp-5) var(--sp-5) var(--sp-4);
  border-bottom:1px solid var(--border-glass-soft);
}
.sidebar-title{ font-weight:700; font-size:1rem; }
.arc-list,.chapter-list{ flex:1; overflow-y:auto; padding:var(--sp-3); display:flex; flex-direction:column; gap:var(--sp-1); }
.chapter-link{
  display:flex; align-items:center; gap:var(--sp-3); width:100%; padding:var(--sp-3) var(--sp-4);
  border-radius:var(--radius-md); border-inline-start:2px solid transparent;
  background:transparent; border-top:0; border-bottom:0; border-inline-end:0; cursor:pointer;
  color:var(--text-muted); font-size:.85rem; text-align:start; transition:all var(--dur-2) var(--ease);
}
.chapter-link:hover{ color:var(--text-main); background:var(--glass); }
.chapter-link.active{
  color:var(--sky); border-inline-start-color:var(--sky); background:var(--sky-glow-soft);
  font-weight:600;
}
.chapter-link .num{ font-size:.72rem; color:var(--text-muted); min-width:22px; flex-shrink:0; }

/* ---------- 6. البطل (Hero) ---------- */
.hero{
  max-width:1100px; margin:var(--sp-7) auto var(--sp-6); padding:0 var(--sp-5);
  display:grid; grid-template-columns:220px 1fr; gap:var(--sp-7); align-items:center;
}
.hero-cover-wrap{ display:flex; justify-content:center; }
.portal-ring{
  position:relative; width:190px; height:190px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 40%, var(--sky-glow-soft), transparent 70%);
}
.portal-ring::before{
  content:""; position:absolute; inset:-10px; border-radius:50%;
  border:1px solid var(--border-glass); opacity:.7;
}
.portal-ring::after{
  content:""; position:absolute; inset:0; border-radius:50%;
  box-shadow:0 0 60px 6px var(--sky-glow-soft); animation:portal-breathe 5s var(--ease) infinite;
}
@keyframes portal-breathe{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
.cover-frame{
  width:100%; height:100%; border-radius:50%; overflow:hidden;
  background:var(--bg-surface-2); border:1px solid var(--border-glass);
  display:flex; align-items:center; justify-content:center; color:var(--text-muted);
  transition:transform var(--dur-3) var(--ease);
}
.cover-frame:hover{ transform:scale(1.045); }
.cover-frame img{ width:100%; height:100%; object-fit:cover; }
.cover-frame svg{ width:44px; height:44px; opacity:.5; }

.author-row{ display:flex; align-items:center; gap:var(--sp-2); margin-top:var(--sp-2); }
.novel-author{ color:var(--text-muted); font-size:.95rem; }
.verified-badge{ display:inline-flex; color:var(--sky); }
.verified-badge svg{ width:16px; height:16px; }

.badges-row{ display:flex; gap:var(--sp-2); margin-bottom:var(--sp-3); flex-wrap:wrap; }
.badge{
  display:inline-flex; align-items:center; gap:var(--sp-2); padding:var(--sp-1) var(--sp-3);
  border-radius:var(--radius-round); font-size:.72rem; font-weight:700; letter-spacing:.02em;
  background:var(--glass); border:1px solid var(--border-glass); color:var(--text-muted);
}
.badge-status{ position:relative; padding-inline-start:var(--sp-4); }
.badge-status .dot{
  position:absolute; inset-inline-start:10px; top:50%; transform:translateY(-50%);
  width:6px; height:6px; border-radius:50%; background:var(--ink-3);
}
.badge-status.ongoing{ color:var(--sky); border-color:var(--sky-glow); }
.badge-status.ongoing .dot{ background:var(--sky); box-shadow:0 0 6px var(--sky-glow); animation:pulse-dot 1.8s ease-in-out infinite; }
.badge-status.finished{ color:var(--ink-2); }
.badge-status.finished .dot{ background:var(--ink-2); }
@keyframes pulse-dot{ 0%,100%{ opacity:1; transform:translateY(-50%) scale(1); } 50%{ opacity:.4; transform:translateY(-50%) scale(1.4); } }

.novel-title{
  font-family:var(--font-display); font-size:clamp(1.5rem,3vw,2.3rem); font-weight:800;
  line-height:1.25; letter-spacing:-.01em;
}
.novel-synopsis{ color:var(--text-muted); font-size:.92rem; line-height:1.7; margin-top:var(--sp-3); max-width:56ch; }

.stats-bar{ display:flex; flex-wrap:wrap; gap:var(--sp-6); margin-top:var(--sp-5); }
.stat-item{ display:flex; align-items:center; gap:var(--sp-2); }
.stat-item svg{ width:17px; height:17px; color:var(--sky); flex-shrink:0; }
.stat-value{ font-weight:700; font-size:.95rem; }
.stat-label{ font-size:.72rem; color:var(--text-muted); display:block; }
.stat-text{ display:flex; flex-direction:column; line-height:1.3; }

/* ---------- 7. صفحة القراءة ---------- */
.reader-page{
  max-width:800px; margin:0 auto var(--sp-8); padding:var(--sp-7) var(--sp-6);
  background:var(--bg-card); background-image:var(--content-glow);
  border:1px solid var(--border-glass-soft); border-radius:var(--radius-xl);
  box-shadow:var(--shadow-soft); position:relative;
}
.chapter-eyebrow{
  font-size:.78rem; color:var(--sky); letter-spacing:.05em; font-weight:700; display:block; margin-bottom:var(--sp-3);
}
.chapter-title{
  font-family:var(--font-reading); font-size:clamp(1.4rem,2.6vw,1.9rem); font-weight:700;
  line-height:1.4; margin-bottom:var(--sp-6);
}
.chapter-body{ font-family:var(--font-reading); font-size:1.125rem; line-height:1.8; color:var(--text-main); }
.chapter-body h2{
  font-family:var(--font-display); font-size:1.15rem; font-weight:700; margin:var(--sp-6) 0 var(--sp-3); color:var(--sky);
}
.p-wrap{ position:relative; margin-bottom:var(--sp-5); padding-inline-start:var(--sp-6); }
.p-wrap p{ margin:0; }
.p-bookmark{
  position:absolute; inset-inline-start:0; top:.2em;
  width:26px; height:26px; display:flex; align-items:center; justify-content:center;
  border-radius:50%; background:transparent; border:none; color:var(--text-muted);
  cursor:pointer; opacity:0; transition:all var(--dur-2) var(--ease);
}
.p-wrap:hover .p-bookmark, .p-bookmark:focus-visible{ opacity:1; }
.p-bookmark:hover{ color:var(--sky); background:var(--sky-glow-soft); }
.p-bookmark svg{ width:15px; height:15px; }
.p-bookmark.saved{ opacity:1; color:var(--sky); }
.p-bookmark.saved svg{ fill:var(--sky); }
.p-wrap.flash{ animation:flash-highlight 1.6s var(--ease); }
@keyframes flash-highlight{ 0%{ background:var(--sky-glow-soft); border-radius:var(--radius-sm); } 100%{ background:transparent; } }

.chapter-nav{
  display:flex; align-items:stretch; gap:var(--sp-3); margin-top:var(--sp-7); padding-top:var(--sp-6);
  border-top:1px solid var(--border-glass-soft);
}
.nav-btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:var(--sp-2);
  padding:var(--sp-4); border-radius:var(--radius-md); background:var(--glass); border:1px solid var(--border-glass);
  color:var(--text-main); cursor:pointer; font-size:.88rem; font-weight:600; transition:all var(--dur-2) var(--ease);
}
.nav-btn svg{ width:16px; height:16px; }
.nav-btn:hover:not(:disabled){ background:var(--glass-strong); border-color:var(--sky-glow); box-shadow:0 0 0 4px var(--sky-glow-soft); }
.nav-btn:disabled{ opacity:.35; cursor:not-allowed; }
.nav-btn-toc{ flex:.6; }

/* زر الحفظ العائم عند تحديد النص */
.selection-bookmark-btn{
  position:fixed; z-index:250; display:flex; align-items:center; gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-4); border-radius:var(--radius-round);
  background:var(--sky); color:var(--sky-ink); font-size:.82rem; font-weight:700;
  box-shadow:var(--shadow-lift); cursor:pointer; opacity:0; visibility:hidden; transform:translateY(6px) scale(.94);
  transition:all var(--dur-2) var(--ease);
}
.selection-bookmark-btn.show{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }
.selection-bookmark-btn svg{ width:15px; height:15px; }

/* ---------- 8. درج الإشارات المرجعية ---------- */
.drawer-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:180; opacity:0; visibility:hidden;
  transition:opacity var(--dur-2) var(--ease);
}
.drawer-overlay.show{ opacity:1; visibility:visible; }
.bookmarks-drawer{
  position:fixed; inset-inline-end:0; top:0; bottom:0; width:min(380px,88vw); z-index:190;
  background:color-mix(in srgb, var(--bg-surface) 94%, transparent); backdrop-filter:blur(22px);
  border-inline-start:1px solid var(--border-glass-soft); display:flex; flex-direction:column;
  transform:translateX(105%);
  transition:transform var(--dur-3) var(--ease);
}
html[dir="rtl"] .bookmarks-drawer{ transform:translateX(-105%); }
.bookmarks-drawer.open{ transform:translateX(0); }
.bookmarks-list{ flex:1; overflow-y:auto; padding:var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-3); }
.bookmark-card{
  padding:var(--sp-4); border-radius:var(--radius-md); background:var(--glass); border:1px solid var(--border-glass-soft);
  cursor:pointer; transition:all var(--dur-2) var(--ease);
}
.bookmark-card:hover{ background:var(--glass-strong); border-color:var(--sky-glow); }
.bookmark-card .bm-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:var(--sp-2); }
.bookmark-card .bm-chapter{ font-size:.72rem; color:var(--sky); font-weight:700; margin-bottom:var(--sp-1); }
.bookmark-card .bm-excerpt{ font-size:.86rem; line-height:1.6; color:var(--text-main); font-family:var(--font-reading); }
.bookmark-card .bm-date{ font-size:.68rem; color:var(--text-muted); margin-top:var(--sp-2); }
.bm-delete{ flex-shrink:0; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); background:transparent; border:none; cursor:pointer; }
.bm-delete:hover{ color:var(--danger); background:rgba(232,115,79,.12); }
.bm-delete svg{ width:13px; height:13px; }
.empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--sp-3); padding:var(--sp-8) var(--sp-5); color:var(--text-muted); text-align:center; }
.empty-state svg{ width:38px; height:38px; opacity:.4; }
.empty-state p{ font-size:.85rem; }

/* ---------- 9. الإشعارات (Toasts) ---------- */
.toast-stack{
  position:fixed; bottom:var(--sp-5); inset-inline-start:50%; transform:translateX(-50%);
  z-index:600; display:flex; flex-direction:column; gap:var(--sp-2); align-items:center; width:min(420px,90vw);
}
html[dir="rtl"] .toast-stack{ transform:translateX(50%); }
.toast{
  display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) var(--sp-5);
  background:color-mix(in srgb, var(--bg-surface) 92%, transparent); backdrop-filter:blur(16px);
  border:1px solid var(--border-glass); border-radius:var(--radius-round); box-shadow:var(--shadow-lift);
  font-size:.82rem; color:var(--text-main); opacity:0; transform:translateY(10px); transition:all var(--dur-2) var(--ease);
  max-width:100%;
}
.toast.show{ opacity:1; transform:translateY(0); }
.toast svg{ width:15px; height:15px; color:var(--sky); flex-shrink:0; }
.toast-action{ color:var(--sky); font-weight:700; cursor:pointer; white-space:nowrap; margin-inline-start:auto; background:none; border:none; font-size:.82rem; }

/* ---------- 10. الاستجابة (Responsive) ---------- */
@media (max-width:860px){
  .hero{ grid-template-columns:1fr; text-align:center; gap:var(--sp-5); margin-top:var(--sp-5); }
  .hero-cover-wrap{ order:0; }
  .author-row{ justify-content:center; }
  .badges-row{ justify-content:center; }
  .stats-bar{ justify-content:center; gap:var(--sp-5); }
  .reader-page{ margin:0 var(--sp-3) var(--sp-7); padding:var(--sp-5) var(--sp-4); border-radius:var(--radius-lg); }
  .topbar{ padding:var(--sp-2) var(--sp-3); }
  .reading-time-pill span{ display:none; }
  .control-trigger span{ display:none; }
}
@media (max-width:520px){
  .portal-ring{ width:150px; height:150px; }
  .chapter-nav{ flex-wrap:wrap; }
  .nav-btn-toc{ order:3; flex-basis:100%; }
}

/* طباعة نظيفة بدون واجهة تحكم */
@media print{
  .topbar,.sidebar,.progress-beam,.bookmarks-drawer,.toast-stack,.selection-bookmark-btn,.chapter-nav{ display:none !important; }
}

function t(key, lang){
  const dict = TRANSLATIONS[lang] || TRANSLATIONS.en;
  return dict[key] || TRANSLATIONS.ar[key] || key;
}

const state = {
  chapterIndex:0,
  lang:'ar', langIsAuto:true,
  bookmarks:[],
  translationCache:{},
  currentTexts:[],
  lastRemovedBookmark:null
};

/* ---------- أدوات مساعدة ---------- */
function $(id){ return document.getElementById(id); }
function storageGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v===null ? fallback : JSON.parse(v); }catch(e){ return fallback; }
}
function storageSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function countWords(text){ return (text.match(/[\p{L}\p{N}]+/gu) || []).length; }
function escapeHtml(str){ return str.replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
function chunkArray(arr, size){
  const out = [];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out;
}

function svgIcon(path, opts){
  opts = opts || {};
  return '<svg viewBox="0 0 24 24" fill="'+(opts.fill||'none')+'" stroke="currentColor" stroke-width="'+(opts.sw||1.75)+'" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>';
}

/* ---------- إشعارات Toast ---------- */
function showToast(message, opts){
  opts = opts || {};
  const stack = $('toastStack');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = (opts.icon||ICONS.lock) + '<span>'+escapeHtml(message)+'</span>' +
    (opts.actionLabel ? '<button class="toast-action">'+escapeHtml(opts.actionLabel)+'</button>' : '');
  stack.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  let removed = false;
  const remove = ()=>{
    if(removed) return; removed = true;
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 300);
  };
  if(opts.actionLabel){
    el.querySelector('.toast-action').addEventListener('click', ()=>{ opts.onAction && opts.onAction(); remove(); });
  }
  setTimeout(remove, opts.timeout || 4200);
}

/* ============================================================
   الترجمة والتوطين (i18n + auto geo-detection)
   ============================================================ */
function applyStaticTranslations(lang){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    const val = t(key, lang);
    if(val) el.textContent = val;
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{
    const key = el.getAttribute('data-i18n-title');
    el.setAttribute('title', t(key, lang));
  });
}

async function translateStrings(strings, lang){
  if(!strings.length) return strings;
  try{
    const joined = strings.join(SEP);
    const translated = await translateText(joined, lang);
    const parts = translated.split(SEP);
    if(parts.length === strings.length) return parts;
    return strings;
  }catch(e){ return strings; }
}

async function translateText(text, targetLang){
  const url = CONFIG.translateEndpoint + '?client=gtx&sl=ar&tl=' + encodeURIComponent(targetLang) + '&dt=t&q=' + encodeURIComponent(text);
  const res = await fetch(url);
  if(!res.ok) throw new Error('translate-http-'+res.status);
  const data = await res.json();
  return data[0].map(chunk=> chunk[0]).join('');
}

async function detectLanguage(){
  const saved = storageGet(CONFIG.storageKeys.lang, 'auto');
  if(saved !== 'auto'){
    return { lang: saved, isAuto:false };
  }
  let lang = null;
  if(CONFIG.enableGeoDetection){
    try{
      const res = await fetch(CONFIG.geoApiUrl);
      if(res.ok){
        const data = await res.json();
        const cc = data.country_code || data.country;
        if(cc && COUNTRY_LANG[cc]) lang = COUNTRY_LANG[cc];
        else if(cc) lang = 'en';
      }
    }catch(e){ /* تعذّر الوصول لخدمة تحديد الموقع — سيُستخدم البديل */ }
  }
  if(!lang){
    const nav = (navigator.language || 'ar').slice(0,2);
    lang = TRANSLATIONS[nav] ? nav : (nav==='ar' ? 'ar' : 'en');
  }
  return { lang, isAuto:true };
}

function setDirForLang(lang){
  const dir = RTL_LANGS.includes(lang) ? 'rtl' : 'ltr';
  document.documentElement.setAttribute('dir', dir);
  document.documentElement.setAttribute('lang', lang);
}

function chapterTitle(ch){ return (ch._t && ch._t[state.lang]) || ch.title; }

async function translateChapterTitles(lang){
  if(lang==='ar') return;
  const need = NOVEL.chapters.filter(c=> !(c._t && c._t[lang]));
  if(!need.length) return;
  const chunks = chunkArray(need, CONFIG.titleTranslateChunkSize);
  for(const chunk of chunks){
    try{
      const translated = await translateStrings(chunk.map(c=>c.title), lang);
      chunk.forEach((c,i)=>{ c._t = c._t||{}; c._t[lang] = translated[i]; });
    }catch(e){ /* تبقى عناوين هذه الدفعة كما هي عند فشلها */ }
  }
}

async function applyLanguage(lang, isAuto, announce){
  state.lang = lang; state.langIsAuto = !!isAuto;
  setDirForLang(lang);
  applyStaticTranslations(lang);
  updateLangTriggerLabel();
  renderStatsBar();
  renderStatusBadge();
  renderSynopsis();

  if(lang !== 'ar'){
    await translateChapterTitles(lang);
  }
  buildSidebar();
  renderBookmarksList();
  renderChapterEyebrow();
  updateReadingTimeDisplay();

  if(announce && lang !== 'ar'){
    showToast(t('langDetected', lang) + ' ' + (LANG_NAMES[lang]||lang));
  }
  if(lang !== 'ar' && CONFIG.enableBodyTranslation){
    translateChapterBody(lang);
  } else {
    renderChapterTexts(getCurrentChapter());
  }
}

function updateLangTriggerLabel(){
  $('langTriggerLabel').textContent = state.langIsAuto ? LANG_NAMES.auto : (LANG_NAMES[state.lang]||state.lang);
}

async function translateChapterBody(lang){
  const chapter = getCurrentChapter();
  if(!chapter) return;
  $('chapterTitle').textContent = chapterTitle(chapter);
  const bodyEl = $('chapterBody');
  const cacheKey = chapter.id+'::body::'+lang;
  if(state.translationCache[cacheKey]){
    paintChapterTexts(state.translationCache[cacheKey]);
    return;
  }
  bodyEl.style.opacity = '.55';
  try{
    const translatedTexts = await translateStrings(state.currentTexts, lang);
    state.translationCache[cacheKey] = translatedTexts;
    paintChapterTexts(translatedTexts);
  }catch(e){ /* يبقى النص الأصلي عند فشل الترجمة */ }
  bodyEl.style.opacity = '';
}
function paintChapterTexts(texts){
  const nodes = document.querySelectorAll('#chapterBody [data-tidx]');
  nodes.forEach(node=>{
    const idx = +node.getAttribute('data-tidx');
    if(texts[idx] !== undefined) node.textContent = texts[idx];
  });
}

/* ============================================================
   محرك عرض الفصول
   ============================================================ */
function getCurrentChapter(){ return NOVEL.chapters[state.chapterIndex]; }
function assignChapterIds(){
  NOVEL.chapters.forEach((ch,i)=>{ if(ch.id===undefined || ch.id===null) ch.id = i+1; });
}
function computeGlobalWordCount(){
  let total = 0;
  NOVEL.chapters.forEach(ch=>{
    ch.paragraphs.forEach(p=>{ total += countWords(typeof p === 'string' ? p : p.h2); });
  });
  return total;
}

function renderChapterTexts(chapter){
  if(!chapter) return;
  $('chapterTitle').textContent = chapter.title;
  const bodyEl = $('chapterBody');
  bodyEl.innerHTML = '';
  const texts = [];
  chapter.paragraphs.forEach((p, i)=>{
    if(typeof p === 'object' && p.h2){
      const h2 = document.createElement('h2');
      h2.setAttribute('data-tidx', texts.length);
      h2.textContent = p.h2;
      texts.push(p.h2);
      bodyEl.appendChild(h2);
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'p-wrap';
      wrap.setAttribute('data-pid', chapter.id+'-'+i);
      const para = document.createElement('p');
      para.setAttribute('data-tidx', texts.length);
      para.textContent = p;
      texts.push(p);
      const btn = document.createElement('button');
      btn.className = 'p-bookmark';
      btn.setAttribute('aria-label','حفظ الفقرة كإشارة');
      btn.setAttribute('aria-pressed','false');
      btn.innerHTML = ICONS.bookmark;
      btn.addEventListener('click', ()=> toggleParagraphBookmark(chapter, i, p, wrap, btn));
      wrap.appendChild(btn);
      wrap.appendChild(para);
      bodyEl.appendChild(wrap);
    }
  });
  state.currentTexts = texts;
  markSavedParagraphs(chapter);
}

function markSavedParagraphs(chapter){
  document.querySelectorAll('#chapterBody .p-wrap').forEach(wrap=>{
    const pid = wrap.getAttribute('data-pid');
    const btn = wrap.querySelector('.p-bookmark');
    const saved = state.bookmarks.some(b=> b.pid===pid && b.type==='paragraph');
    btn.classList.toggle('saved', saved);
    btn.setAttribute('aria-pressed', saved ? 'true':'false');
    btn.innerHTML = saved ? ICONS.bookmarkFilled : ICONS.bookmark;
  });
}

function updateReadingTimeDisplay(){
  const chapter = getCurrentChapter();
  if(!chapter) return;
  const words = chapter.paragraphs.reduce((sum,p)=> sum + countWords(typeof p==='string'?p:p.h2), 0);
  const avgWpm = (CONFIG.wpmMin + CONFIG.wpmMax)/2;
  const minutes = Math.round(words / avgWpm);
  const label = minutes < 1 ? t('lessThanMinute', state.lang) : (minutes + ' ' + t('minutesRead', state.lang));
  $('readingTimeText').textContent = label;
}

function renderChapterEyebrow(){
  const total = NOVEL.chapters.length;
  $('chapterEyebrow').textContent = t('chapterWord', state.lang) + ' ' + (state.chapterIndex+1) + ' / ' + total;
}

function renderChapterNav(){
  $('prevBtn').disabled = state.chapterIndex === 0;
  $('nextBtn').disabled = state.chapterIndex === NOVEL.chapters.length-1;
}

function renderChapter(c, opts){
  opts = opts || {};
  state.chapterIndex = c;
  const chapter = getCurrentChapter();
  if(!chapter) return;

  renderChapterEyebrow();
  renderChapterTexts(chapter);
  renderChapterNav();
  updateReadingTimeDisplay();
  document.title = chapter.title + ' — for lunch time';
  storageSet(CONFIG.storageKeys.progress, c);
  updateActiveSidebarLink();

  if(state.lang !== 'ar' && CONFIG.enableBodyTranslation){
    translateChapterBody(state.lang);
  }
  if(!opts.silentScroll){
    const target = $('readerPage');
    const top = target.getBoundingClientRect().top + window.scrollY - 90;
    window.scrollTo({ top, behavior: opts.jump ? 'smooth' : 'auto' });
  }
  requestAnimationFrame(updateProgressBeam);
}

function goNext(){
  if(state.chapterIndex < NOVEL.chapters.length-1) renderChapter(state.chapterIndex+1);
}
function goPrev(){
  if(state.chapterIndex > 0) renderChapter(state.chapterIndex-1);
}

/* ============================================================
   الشريط الجانبي (الفهرس) — قائمة مسطّحة من الفصول
   ============================================================ */
function buildSidebar(){
  const list = $('chapterList');
  list.innerHTML = '';
  NOVEL.chapters.forEach((ch,ci)=>{
    const link = document.createElement('button');
    link.className = 'chapter-link' + (ci===state.chapterIndex ? ' active':'');
    link.setAttribute('data-idx', ci);
    link.innerHTML = '<span class="num">'+(ci+1)+'</span><span></span>';
    link.querySelector('span:last-child').textContent = chapterTitle(ch);
    link.addEventListener('click', ()=>{
      renderChapter(ci, {jump:true});
      closeSidebar();
    });
    list.appendChild(link);
  });
}
function updateActiveSidebarLink(){
  document.querySelectorAll('.chapter-link').forEach(link=>{
    link.classList.toggle('active', +link.getAttribute('data-idx') === state.chapterIndex);
  });
}
function openSidebar(){ $('sidebar').classList.add('open'); $('sidebarOverlay').classList.add('show'); }
function closeSidebar(){ $('sidebar').classList.remove('open'); $('sidebarOverlay').classList.remove('show'); }

/* ============================================================
   شريط الإحصاءات وشارة الحالة والتقييم والملخّص
   ============================================================ */
function renderStarRating(ratingOutOf10){
  const pct = Math.max(0, Math.min(100, (ratingOutOf10/10)*100));
  return '<span class="stars" style="position:relative;display:inline-flex;">' +
    '<span style="display:flex;gap:2px;opacity:.3;">'+Array(5).fill('<i style="width:15px;height:15px;display:inline-flex">'+ICONS.star+'</i>').join('')+'</span>' +
    '<span style="position:absolute;inset:0;overflow:hidden;width:'+pct+'%;display:flex;gap:2px;color:var(--sky);">'+Array(5).fill('<i style="width:15px;height:15px;display:inline-flex">'+ICONS.star+'</i>').join('')+'</span>' +
    '</span>';
}
function renderStatsBar(){
  const words = computeGlobalWordCount();
  const bar = $('statsBar');
  bar.innerHTML =
    statItem(ICONS.words, words.toLocaleString(state.lang==='ar'?'ar':state.lang), t('statWords', state.lang)) +
    statItem(ICONS.chapters, NOVEL.chapters.length, t('statChapters', state.lang)) +
    statItem(ICONS.eye, (NOVEL.views||0).toLocaleString(state.lang==='ar'?'ar':state.lang), t('statViews', state.lang)) +
    '<div class="stat-item"><span style="color:var(--sky);display:flex">'+ICONS.starOutline+'</span><div class="stat-text"><span class="stat-value">'+(NOVEL.rating||0).toFixed(1)+'/10</span>'+renderStarRating(NOVEL.rating||0)+'</div></div>';
}
function statItem(icon, value, label){
  return '<div class="stat-item">'+icon+'<div class="stat-text"><span class="stat-value">'+value+'</span><span class="stat-label">'+label+'</span></div></div>';
}
function renderStatusBadge(){
  const badge = $('statusBadge');
  const isOngoing = NOVEL.status === 'ongoing';
  badge.classList.toggle('ongoing', isOngoing);
  badge.classList.toggle('finished', !isOngoing);
  $('statusText').textContent = isOngoing ? t('ongoingStatus', state.lang) : t('finishedStatus', state.lang);
}
function renderSynopsis(){
  const el = $('novelSynopsis');
  if(NOVEL.synopsis){ el.textContent = NOVEL.synopsis; el.style.display = ''; }
  else { el.style.display = 'none'; }
}
function renderHeroStatic(){
  $('novelTitle').textContent = NOVEL.title;
  $('novelAuthor').textContent = NOVEL.author;
  if(NOVEL.coverImage){
    $('coverFrame').innerHTML = '<img src="'+NOVEL.coverImage+'" alt="'+escapeHtml(NOVEL.title)+'" draggable="false">';
  }
}

/* ============================================================
   شريط تقدّم القراءة
   ============================================================ */
let beamTicking = false;
function updateProgressBeam(){
  const doc = document.documentElement;
  const scrollable = doc.scrollHeight - doc.clientHeight;
  const pct = scrollable > 0 ? (window.scrollY/scrollable)*100 : 0;
  const clamped = Math.min(100, Math.max(0,pct));
  $('progressBeam').style.width = clamped + '%';
  $('progressBeam').setAttribute('aria-valuenow', Math.round(clamped));
  beamTicking = false;
}
function onScroll(){
  if(!beamTicking){ requestAnimationFrame(updateProgressBeam); beamTicking = true; }
}

/* ============================================================
   الإشارات المرجعية
   ============================================================ */
function loadBookmarks(){ state.bookmarks = storageGet(CONFIG.storageKeys.bookmarks, []); }
function persistBookmarks(){ storageSet(CONFIG.storageKeys.bookmarks, state.bookmarks); updateBookmarksBadge(); }
function updateBookmarksBadge(){
  const el = $('bmCount');
  const n = state.bookmarks.length;
  el.textContent = n;
  el.classList.toggle('show', n>0);
}
function addBookmark(bm){
  bm.id = Date.now()+'-'+Math.random().toString(36).slice(2,7);
  bm.savedAt = new Date().toISOString();
  state.bookmarks.unshift(bm);
  persistBookmarks();
  renderBookmarksList();
  showToast(t('bookmarkSaved', state.lang), {icon:ICONS.bookmarkFilled});
}
function removeBookmark(id){
  const idx = state.bookmarks.findIndex(b=>b.id===id);
  if(idx===-1) return;
  state.lastRemovedBookmark = {item: state.bookmarks[idx], index: idx};
  state.bookmarks.splice(idx,1);
  persistBookmarks();
  renderBookmarksList();
  showToast(t('bookmarkRemoved', state.lang), {
    icon:ICONS.trash,
    actionLabel:t('undo', state.lang),
    onAction:()=>{
      if(state.lastRemovedBookmark){
        state.bookmarks.splice(state.lastRemovedBookmark.index,0,state.lastRemovedBookmark.item);
        persistBookmarks(); renderBookmarksList();
      }
    }
  });
  markSavedParagraphs(getCurrentChapter());
}
function toggleParagraphBookmark(chapter, i, text, wrapEl, btnEl){
  const pid = chapter.id+'-'+i;
  const existing = state.bookmarks.find(b=> b.pid===pid && b.type==='paragraph');
  if(existing){ removeBookmark(existing.id); return; }
  addBookmark({
    type:'paragraph', pid, chapterIndex: state.chapterIndex,
    chapterTitle: chapter.title, excerpt: text.slice(0,140) + (text.length>140?'…':'')
  });
  markSavedParagraphs(chapter);
}
function renderBookmarksList(){
  const list = $('bookmarksList');
  list.innerHTML = '';
  if(!state.bookmarks.length){
    list.innerHTML = '<div class="empty-state">'+ICONS.bookmark+'<p>'+t('emptyBookmarks', state.lang)+'</p></div>';
    return;
  }
  state.bookmarks.forEach(bm=>{
    const card = document.createElement('div');
    card.className = 'bookmark-card';
    const date = new Date(bm.savedAt);
    const dateStr = date.toLocaleDateString(state.lang==='ar'?'ar':state.lang, {day:'numeric', month:'short'}) + ' · ' + date.toLocaleTimeString(state.lang==='ar'?'ar':state.lang, {hour:'2-digit', minute:'2-digit'});
    card.innerHTML =
      '<div class="bm-top"><div><div class="bm-chapter"></div><div class="bm-excerpt"></div></div>'+
      '<button class="bm-delete" aria-label="حذف">'+ICONS.trash+'</button></div>'+
      '<div class="bm-date">'+dateStr+'</div>';
    card.querySelector('.bm-chapter').textContent = bm.chapterTitle;
    card.querySelector('.bm-excerpt').textContent = bm.excerpt;
    card.querySelector('.bm-delete').addEventListener('click', (e)=>{ e.stopPropagation(); removeBookmark(bm.id); });
    card.addEventListener('click', ()=> jumpToBookmark(bm));
    list.appendChild(card);
  });
}
function jumpToBookmark(bm){
  const needsNav = state.chapterIndex !== bm.chapterIndex;
  if(needsNav) renderChapter(bm.chapterIndex, {silentScroll:true});
  closeDrawer();
  setTimeout(()=>{
    const el = document.querySelector('[data-pid="'+bm.pid+'"]');
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.add('flash');
      setTimeout(()=> el.classList.remove('flash'), 1600);
    }
  }, needsNav ? 200 : 60);
}
function openDrawer(){ $('bookmarksDrawer').classList.add('open'); $('drawerOverlay').classList.add('show'); }
function closeDrawer(){ $('bookmarksDrawer').classList.remove('open'); $('drawerOverlay').classList.remove('show'); }

/* زر الحفظ العائم عند تحديد نص */
function initSelectionBookmark(){
  const btn = $('selectionBookmarkBtn');
  let pendingRange = null;
  function handleSelection(){
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || !sel.toString().trim()){ btn.classList.remove('show'); return; }
    const anchor = sel.anchorNode;
    const wrap = anchor && anchor.nodeType===3 ? anchor.parentElement.closest('.p-wrap') : (anchor && anchor.closest && anchor.closest('.p-wrap'));
    if(!wrap){ btn.classList.remove('show'); return; }
    pendingRange = { text: sel.toString().trim(), pid: wrap.getAttribute('data-pid') };
    const rect = sel.getRangeAt(0).getBoundingClientRect();
    btn.style.top = Math.max(10, rect.top - 46) + 'px';
    btn.style.left = Math.max(10, rect.left + rect.width/2 - 70) + 'px';
    btn.classList.add('show');
  }
  document.addEventListener('mouseup', handleSelection);
  document.addEventListener('touchend', handleSelection);
  btn.addEventListener('click', ()=>{
    if(!pendingRange) return;
    const chapter = getCurrentChapter();
    addBookmark({
      type:'excerpt', pid: pendingRange.pid, chapterIndex: state.chapterIndex,
      chapterTitle: chapter.title, excerpt: pendingRange.text.slice(0,160) + (pendingRange.text.length>160?'…':'')
    });
    btn.classList.remove('show');
    window.getSelection().removeAllRanges();
  });
  document.addEventListener('scroll', ()=> btn.classList.remove('show'), {passive:true});
}

/* ============================================================
   حماية المحتوى من النسخ (Anti-Copy)
   ============================================================ */
function initAntiCopy(){
  document.addEventListener('contextmenu', e=>{
    e.preventDefault();
    showToast(t('rightClickBlocked', state.lang));
  });
  document.addEventListener('copy', e=>{
    const sel = window.getSelection().toString();
    if(!sel) return;
    e.preventDefault();
    const watermark = '\n\n— for lunch time: '+NOVEL.title+' — '+location.href;
    e.clipboardData.setData('text/plain', sel + watermark);
    showToast(t('copyBlocked', state.lang));
  });
  document.addEventListener('keydown', e=>{
    const k = e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey) && (k==='s' || k==='u')){ e.preventDefault(); showToast(t('rightClickBlocked', state.lang)); }
    if(k==='f12' || ((e.ctrlKey||e.metaKey) && e.shiftKey && (k==='i'||k==='j'||k==='c'))){
      e.preventDefault(); showToast(t('devtoolsBlocked', state.lang));
    }
  });
  document.addEventListener('dragstart', e=>{
    if(e.target.tagName==='IMG') e.preventDefault();
  });
}

/* ============================================================
   لوحات التحكم المنسدلة (لغة / خط / مظهر)
   ============================================================ */
function buildControlPanel(containerId, options, currentGetter, onSelect){
  const panel = $(containerId);
  panel.innerHTML = '';
  options.forEach(opt=>{
    const row = document.createElement('div');
    row.className = 'control-option' + (currentGetter()===opt.value ? ' active':'');
    row.innerHTML = '<span>'+opt.label+'</span><span class="dot"></span>';
    row.addEventListener('click', ()=>{ onSelect(opt.value); });
    panel.appendChild(row);
  });
}
function initDropdowns(){
  const groups = ['langControl','fontControl','themeControl'];
  groups.forEach(id=>{
    const group = $(id);
    const trigger = group.querySelector('.control-trigger');
    trigger.addEventListener('click', (e)=>{
      e.stopPropagation();
      const willOpen = !group.classList.contains('open');
      groups.forEach(g=> $(g).classList.remove('open'));
      if(willOpen) group.classList.add('open');
    });
  });
  document.addEventListener('click', ()=> groups.forEach(g=> $(g).classList.remove('open')));
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') groups.forEach(g=> $(g).classList.remove('open')); });
}

function initLangPanel(){
  const options = [{value:'auto', label:LANG_NAMES.auto}].concat(
    Object.keys(LANG_NAMES).filter(k=>k!=='auto').map(k=>({value:k, label:LANG_NAMES[k]}))
  );
  buildControlPanel('langPanel', options, ()=> state.langIsAuto ? 'auto' : state.lang, async (value)=>{
    storageSet(CONFIG.storageKeys.lang, value);
    if(value==='auto'){
      const {lang} = await detectLanguage();
      applyLanguage(lang, true, false);
    } else {
      applyLanguage(value, false, false);
    }
    initLangPanel();
    $('langControl').classList.remove('open');
  });
}
function initFontPanel(){
  const options = [
    {value:'naskh', label:'Noto Naskh'},
    {value:'cairo', label:'Cairo'},
    {value:'tajawal', label:'Tajawal'}
  ];
  buildControlPanel('fontPanel', options, ()=> document.documentElement.getAttribute('data-font'), (value)=>{
    document.documentElement.setAttribute('data-font', value);
    storageSet(CONFIG.storageKeys.font, value);
    initFontPanel();
    $('fontControl').classList.remove('open');
  });
}
function initThemePanel(){
  const options = [
    {value:'day', label:t('themeDay', state.lang)},
    {value:'night', label:t('themeNight', state.lang)},
    {value:'dusk', label:t('themeDusk', state.lang)}
  ];
  buildControlPanel('themePanel', options, ()=> document.documentElement.getAttribute('data-theme'), (value)=>{
    document.documentElement.setAttribute('data-theme', value);
    storageSet(CONFIG.storageKeys.theme, value);
    initThemePanel();
    $('themeControl').classList.remove('open');
  });
}

/* ============================================================
   التنقّل بلوحة المفاتيح
   ============================================================ */
function initKeyboardNav(){
  document.addEventListener('keydown', e=>{
    const tag = (e.target.tagName||'').toLowerCase();
    if(tag==='input' || tag==='textarea') return;
    const dir = document.documentElement.getAttribute('dir');
    const forwardKey = dir==='rtl' ? 'ArrowLeft' : 'ArrowRight';
    const backwardKey = dir==='rtl' ? 'ArrowRight' : 'ArrowLeft';
    if(e.key===forwardKey) goNext();
    else if(e.key===backwardKey) goPrev();
  });
}

/* ============================================================
   التهيئة الأولية
   ============================================================ */
function initToggles(){
  $('menuToggle').addEventListener('click', openSidebar);
  $('sidebarClose').addEventListener('click', closeSidebar);
  $('sidebarOverlay').addEventListener('click', closeSidebar);
  $('bookmarksToggle').addEventListener('click', openDrawer);
  $('drawerClose').addEventListener('click', closeDrawer);
  $('drawerOverlay').addEventListener('click', closeDrawer);
  $('tocMidBtn').addEventListener('click', openSidebar);
  $('prevBtn').addEventListener('click', goPrev);
  $('nextBtn').addEventListener('click', goNext);
}

function restoreThemeAndFont(){
  const theme = storageGet(CONFIG.storageKeys.theme, 'night');
  const font = storageGet(CONFIG.storageKeys.font, 'naskh');
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.setAttribute('data-font', font);
}

function maybeOfferResume(){
  const saved = storageGet(CONFIG.storageKeys.progress, null);
  if(typeof saved === 'number' && saved !== 0){
    showToast(t('resumeReading', state.lang), {
      actionLabel: t('resumeAction', state.lang),
      onAction: ()=> renderChapter(saved, {jump:true}),
      timeout: 7000
    });
  }
}

async function init(){
  assignChapterIds();
  restoreThemeAndFont();
  loadBookmarks();
  renderHeroStatic();
  initToggles();
  initDropdowns();
  initFontPanel();
  initThemePanel();
  initSelectionBookmark();
  initAntiCopy();
  initKeyboardNav();
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', updateProgressBeam);

  renderChapter(0, {silentScroll:true});
  updateBookmarksBadge();

  const {lang, isAuto} = await detectLanguage();
  await applyLanguage(lang, isAuto, isAuto);
  initLangPanel();

  maybeOfferResume();
  updateProgressBeam();
}

document.addEventListener('DOMContentLoaded', init);

})();
</script>
