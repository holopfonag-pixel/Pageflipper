<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>Page Not Found — Lunch Time</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      text-align: center;
    }
    .error-card {
      width: min(100%, 560px);
      padding: clamp(36px, 8vw, 72px);
    }
    .error-code {
      margin-bottom: 18px;
      color: var(--c-accent);
      font-family: var(--f-display-latin);
      font-size: clamp(4rem, 13vw, 7rem);
      line-height: 0.9;
    }
    .error-title {
      margin-bottom: 16px;
      font-family: var(--f-display-latin);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
    }
    .error-copy {
      max-width: 36ch;
      margin: 0 auto 28px;
      color: var(--c-text-muted);
    }
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card ghost-frame" aria-labelledby="error-title">
      <p class="error-code" aria-hidden="true">404</p>
      <h1 class="error-title" id="error-title">This page has gone quiet.</h1>
      <p class="error-copy">The page you are looking for is not part of this chapter.</p>
      <a class="btn-primary" href="./">Return to the library</a>
    </section>
  </main>
</body>
</html>
